services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: mattertest
      POSTGRES_PASSWORD: mattertest
      POSTGRES_DB: mattertest
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  pgdata:
